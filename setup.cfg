# setup.cfg

[isort]
profile = black
line_length = 127
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True

[flake8]
max-line-length = 127
ignore = E501, E203, W503
exclude = .git,__pycache__,venv,migrations,settings.py,hello
