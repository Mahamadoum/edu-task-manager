{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 700px; margin: 0 auto;">
    <h2>{{ title }}</h2>
    <form method="post" style="margin-top: 25px;">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field.errors }}
            {{ field }}
            {% if field.help_text %}
            <small style="color: #666; font-size: 12px;">{{ field.help_text }}</small>
            {% endif %}
        </div>
        {% endfor %}
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button type="submit" class="btn btn-success" style="padding: 12px 30px;">💾 Enregistrer</button>
            <a href="{% url 'assignments:discipline_list' %}" class="btn btn-primary" style="padding: 12px 30px;">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
