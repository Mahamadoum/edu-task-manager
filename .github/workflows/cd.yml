name: CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/edu-task-manager:latest
            ${{ secrets.DOCKER_USERNAME }}/edu-task-manager:${{ github.sha }}

      - name: Vérifier la publication
        run: |
          echo "✅ Image publiée avec succès!"
          echo "📦 Image: ${{ secrets.DOCKER_USERNAME }}/edu-task-manager:latest"
          echo "🔢 SHA: ${{ github.sha }}"