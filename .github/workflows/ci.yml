name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main", "test-ci" ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les linters
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort

      - name: Vérification du style (Black)
        run: black --check .

      - name: Vérification du style (Flake8)
        run: flake8 . --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Vérification des imports (isort)
        run: isort --check-only .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django

      - name: Exécuter les tests
        env:
          DJANGO_SETTINGS_MODULE: backend.settings
          SECRET_KEY: test_secret_key
          DEBUG: False
        run: |
          python manage.py test
          pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image Docker
        run: docker build -t edu-task-manager:test .
